config:
  target: "http://data.fixer.io"
  phases:
    - duration: 1
      arrivalRate: 1
      name: "Scalability Test 1"
    - duration: 1
      arrivalRate: 2
      name: "Scalability Test 2"
    - duration: 1
      arrivalRate: 3
      name: "Scalability Test 3"

  plugins:
    ensure: {}
    expect: {}

  ensure:
    thresholds:
      - http.response_time.p95: 800
      - http.response_time.p99: 1000
    conditions:
      - expression: "vusers.failed == 0"
      - expression: "http.response_time.max < 2000"

  payload:
    path: "currencies.csv"
    fields:
      - symbol
    order: sequence

scenarios:
  - name: "Fixer API - symbols and latest rates"
    flow:
      - get:
          url: "/api/symbols?access_key={{ $processEnvironment.FIXER_API_KEY }}"
          expect:
            - statusCode: 200
            - hasProperty: symbols
      - get:
          url: "/api/latest?access_key={{ $processEnvironment.FIXER_API_KEY }}&symbols={{ symbol }}"
          expect:
            - statusCode: 200
            - hasProperty: rates
